# The bench's copy of ~/.config/featherloop/config.yaml, on one provider, the
# bench's metering proxy (BENCH_BASE_URL). The bench adds the model under test,
# from models.json, as the user's config has it. No advisor: every harness runs
# the same model alone.
provider:
  bench:
    flavor: openai
    options:
      baseURL: "{env:BENCH_BASE_URL}"
      # llama.cpp takes any key; the bench keeps real ones out of the harnesses' environment.
      apiKey: bench
    models: {}
